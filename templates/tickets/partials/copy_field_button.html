{% load i18n %}
<button type="button" class="ticket-copy-number-btn"
    data-copy-text="{{ copy_text }}"
    data-copy-label="{{ copy_label }}"
    data-copied-label="{% trans 'Copied' %}"
    onclick="copyTicketNumber(this)"
    aria-label="{{ copy_label }}"
    title="{{ copy_label }}">
    <svg class="ticket-copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
    <svg class="ticket-copy-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
</button>
<span class="ticket-copy-status visually-hidden" aria-live="polite"></span>
