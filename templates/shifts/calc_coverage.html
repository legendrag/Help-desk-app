<table class="shifts-coverage">
  <thead>
    <tr>
      <th></th>
      {% for day in dates %}
      <th><bdi class="shifts-ltr" dir="ltr">{{ day|date:"D j" }}</bdi></th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
  {% for row in rows %}
  <tr>
    <th scope="row"><bdi dir="auto">{{ row.label }}</bdi></th>
  {% for cell in row.cells %}
  <td id="cov-{{ cell.day|date:'Y-m-d' }}-{{ cell.hour }}"{% if cell.count == 0 %} class="shifts-gap"{% endif %}>{{ cell.count }}</td>
  {% endfor %}
  </tr>
  {% endfor %}
  </tbody>
</table>
