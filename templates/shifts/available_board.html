{% load i18n %}
<div id="shifts-available-now"
     hx-get="{% url 'shifts_available_board' %}"
     hx-trigger="every 20s [!document.hidden], refresh"
     hx-swap="outerHTML"
     data-no-progress
     data-etag="{{ board_etag }}"
     aria-live="polite">
  <div class="shifts-cards">
    {% for card in cards %}
    <section class="panel">
      <h2>{{ card.department.name }}</h2>
      {% if card.people %}
      <ul>
        {% for person in card.people %}
        <li>{{ person.name }} {{ person.end|date:"H:i" }}</li>
        {% endfor %}
      </ul>
      {% else %}
      <p>{% trans "Nobody on shift now" %}</p>
      {% endif %}
    </section>
    {% endfor %}
  </div>
</div>
