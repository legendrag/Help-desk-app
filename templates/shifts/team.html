{% extends "shifts/shell.html" %}
{% load i18n %}
{% block shifts_body %}
<h1>{% trans "Team rota" %}</h1>
{% if error %}
<p>{{ error }}</p>
{% else %}
{% if is_manager %}
<form method="get" class="shifts-toolbar" action="{% url 'shifts_team' %}">
  <label for="team-department">{% trans "Department" %}</label>
  <select id="team-department" name="department">
    {% for row in departments %}
    <option value="{{ row.pk }}"{% if department.pk == row.pk %} selected{% endif %}>{{ row.name }}</option>
    {% endfor %}
  </select>
  <input type="hidden" name="view" value="{{ view }}">
  <input type="hidden" name="start" value="{{ start|date:'Y-m-d' }}">
  <button class="btn secondary" type="submit">{% trans "Show" %}</button>
</form>
{% endif %}
<p>{{ dates.0|date:"Y-m-d" }}–{{ dates|last|date:"Y-m-d" }}</p>
{% include "shifts/rota_grid.html" %}
{% endif %}
{% endblock %}
