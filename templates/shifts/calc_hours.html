{% load i18n %}
<table class="shifts-list">
  <thead>
    <tr>
      <th>{% trans "Person" %}</th>
      <th>{% trans "Day" %}</th>
      <th>{% trans "Night" %}</th>
      <th>{% trans "Total" %}</th>
    </tr>
  </thead>
  {% for person in people %}
  <tr>
    <td data-label="{% trans "Person" %}">{{ person.name }}</td>
    <td data-label="{% trans "Day" %}">{{ person.day }}</td>
    <td data-label="{% trans "Night" %}">{{ person.night }}</td>
    <td data-label="{% trans "Total" %}">{{ person.total }}</td>
  </tr>
  {% endfor %}
</table>
