{% extends "shifts/shell.html" %}
{% load i18n %}
{% block shifts_body %}
<header class="shifts-header">
  <div class="shifts-title-wrap">
    <h1>{% trans "Available now" %}</h1>
    <p class="shifts-range" id="shifts-avail-total">
      {% blocktrans count counter=on_shift_total %}{{ counter }} person on shift{% plural %}{{ counter }} people on shift{% endblocktrans %}
    </p>
  </div>
  <div class="search-field shifts-avail-search">
    <span class="search-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </span>
    <input type="search" id="shifts-avail-filter" class="search-input" autocomplete="off"
           placeholder="{% trans 'Search people or departments' %}"
           aria-label="{% trans 'Search people or departments' %}">
  </div>
</header>
{% include "shifts/available_board.html" %}
{% endblock %}
