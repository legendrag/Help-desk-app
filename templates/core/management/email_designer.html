{% load static %}
<section class="email-designer management-section" id="email-designer"
         data-brand-save-url="{% url 'email_brand_save' %}"
         data-can-edit="{{ can_edit_email_format|yesno:'true,false' }}">
    <div class="section-header mgmt-section-header">
        <div>
            <h2 class="mgmt-section-title">Email Format</h2>
            <p class="mgmt-section-subtitle">Edit how notification emails look and what they say.</p>
        </div>
    </div>

    <form class="email-brand-strip" id="email-brand-form">
        {% csrf_token %}
        <div class="email-brand-strip__fields">
            <label class="email-brand-field">
                <span>Brand name</span>
                <input type="text" name="brand_name" id="email-brand-name" class="form-control"
                       value="{{ email_brand.brand_name }}"
                       {% if not can_edit_email_format %}disabled{% endif %}>
            </label>
            <label class="email-brand-field email-brand-field--color">
                <span>Accent color</span>
                <div class="email-brand-color-row">
                    <input type="color" id="email-brand-color-picker" value="{{ email_brand.accent_color }}"
                           aria-label="Pick accent color"
                           {% if not can_edit_email_format %}disabled{% endif %}>
                    <input type="text" name="accent_color" id="email-brand-accent" class="form-control"
                           value="{{ email_brand.accent_color }}" spellcheck="false"
                           {% if not can_edit_email_format %}disabled{% endif %}>
                </div>
            </label>
            <label class="email-brand-field email-brand-field--footer">
                <span>Footer text</span>
                <input type="text" name="footer_note" id="email-brand-footer" class="form-control"
                       value="{{ email_brand.footer_note }}"
                       {% if not can_edit_email_format %}disabled{% endif %}>
            </label>
        </div>
        {% if can_edit_email_format %}
        <button type="submit" class="btn secondary small" id="email-brand-save-btn">Save look</button>
        {% endif %}
    </form>

    <div class="email-designer__workspace">
        <aside class="email-type-list" aria-label="Email types">
            <div class="email-type-list__mobile">
                <label for="email-type-select">Email type</label>
                <select id="email-type-select" class="form-control">
                    {% for item in email_event_types %}
                    <option value="{{ item.event_type }}" {% if item.event_type == selected_email_type %}selected{% endif %}>
                        {{ item.label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <ul class="email-type-list__items">
                {% for item in email_event_types %}
                <li>
                    <button type="button"
                            class="email-type-btn{% if item.event_type == selected_email_type %} is-active{% endif %}"
                            data-event-type="{{ item.event_type }}"
                            hx-get="{% url 'email_designer_canvas' item.event_type %}"
                            hx-target="#email-canvas-host"
                            hx-swap="innerHTML">
                        <span class="email-type-btn__label">{{ item.label }}</span>
                        <span class="email-type-btn__purpose">{{ item.purpose }}</span>
                    </button>
                </li>
                {% endfor %}
            </ul>
        </aside>

        <div class="email-designer__canvas-host" id="email-canvas-host">
            {% include "core/management/email_designer_canvas.html" %}
        </div>
    </div>
</section>
