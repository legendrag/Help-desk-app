<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand_name }}</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background:#4f46e5;padding:16px 24px;">
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  {% if brand_icon_url %}
                  <td style="vertical-align:middle;padding-right:10px;">
                    <img
                      src="{{ brand_icon_url }}"
                      alt=""
                      width="32"
                      height="32"
                      style="display:block;border:0;outline:none;text-decoration:none;"
                    >
                  </td>
                  {% endif %}
                  <td style="vertical-align:middle;">
                    {% if brand_logo_url %}
                    <img
                      src="{{ brand_logo_url }}"
                      alt="{{ brand_name }}"
                      height="28"
                      style="display:block;border:0;outline:none;text-decoration:none;height:28px;width:auto;max-height:28px;"
                    >
                    {% else %}
                    <div style="font-size:18px;font-weight:700;letter-spacing:0.02em;color:#ffffff;">{{ brand_name }}</div>
                    {% endif %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px 8px 24px;">
              {% if body_html %}
              <div style="margin:0 0 22px 0;font-size:15px;line-height:1.55;color:#1e293b;">{{ body_html|safe }}</div>
              {% endif %}

              {% if cta_url %}
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:0 0 8px 0;">
                <tr>
                  <td style="border-radius:10px;background:#4f46e5;">
                    <a href="{{ cta_url }}" style="display:inline-block;padding:12px 18px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">{{ cta_label }}</a>
                  </td>
                </tr>
              </table>
              <p style="margin:10px 0 0 0;font-size:12px;line-height:1.5;color:#94a3b8;word-break:break-all;">
                Or open: <a href="{{ cta_url }}" style="color:#4338ca;text-decoration:underline;">{{ cta_url }}</a>
              </p>
              {% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 24px 24px 24px;border-top:1px solid #e2e8f0;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#94a3b8;">{{ footer_note }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
